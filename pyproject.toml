[project]
name = "aegis-control-plane"
version = "0.1.0.dev0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "pydantic>=2.11,<3",
  "pyyaml>=6.0,<7",
  "structlog>=25.4,<26",
  "typer>=0.16,<1",
  "uvicorn>=0.35,<1",
]

[dependency-groups]
dev = [
  "hypothesis>=6.138,<7",
  "mypy>=1.17,<2",
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
  "ruff>=0.12,<1",
  "types-PyYAML>=6.0,<7",
]

[project.scripts]
ae = "aegis.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aegis"]

[tool.hatch.build.targets.wheel.force-include]
"src/aegis/data/companions/roles.compiled.json" = "aegis/data/companions/roles.compiled.json"
"src/aegis/data/companions/roles.provenance.json" = "aegis/data/companions/roles.provenance.json"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --strict-config"
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"
# Companion submodules carry their own lint/CI; Aegis lints only its own sources.
extend-exclude = ["packages"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["aegis"]
